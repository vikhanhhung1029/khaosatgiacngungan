<!doctype html>
<html lang="vi">
  <head>
    <!-- GitHub Pages deployment refresh: serve the Vite-built dist output. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Khảo Sát & Đánh Giá Giấc Ngủ Ngắn</title>
    <meta name="description" content="Nền tảng kiểm tra phản xạ, chú ý chọn lọc, trí nhớ và khảo sát mức độ tỉnh táo trước và sau giấc ngủ ngắn." />
    <meta property="og:title" content="Khảo Sát & Đánh Giá Giấc Ngủ Ngắn" />
    <meta property="og:description" content="Nền tảng kiểm tra phản xạ, chú ý chọn lọc, trí nhớ và khảo sát mức độ tỉnh táo trước và sau giấc ngủ ngắn." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      #boot-error { display:none; max-width:680px; margin:48px auto; padding:24px; font:16px/1.6 system-ui,sans-serif; color:#0f172a; }
      #boot-error pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f1f5f9; border-radius:8px; padding:14px; font-size:13px; }
      #boot-error button { background:#4f46e5; color:white; border:0; border-radius:8px; padding:10px 16px; cursor:pointer; }
    </style>
    <script>
      (function () {
        var showError = function (message) {
          var box = document.getElementById('boot-error');
          var detail = document.getElementById('boot-error-detail');
          if (!box || document.documentElement.dataset.appBooted === 'true') return;
          detail.textContent = message || 'Không tải được mã JavaScript của ứng dụng.';
          box.style.display = 'block';
        };
        window.addEventListener('error', function (event) {
          if (event && event.message) showError('Lỗi JavaScript: ' + event.message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          showError('Lỗi tác vụ không xử lý: ' + (reason && reason.message ? reason.message : String(reason || 'Không rõ nguyên nhân')));
        });
        window.setTimeout(function () {
          if (document.documentElement.dataset.appBooted !== 'true') {
            showError('Ứng dụng chưa khởi động sau 12 giây. Có thể tệp JavaScript bị lỗi tải hoặc bị trình duyệt chặn.');
          }
        }, 12000);
        window.__showAppBootError = showError;
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
    <main id="boot-error" role="alert" aria-live="assertive">
      <h1 style="font-size:24px;margin:0 0 12px">Website chưa khởi động được</h1>
      <p>Trang đã tải nhưng ứng dụng không khởi động bình thường. Thông tin kỹ thuật:</p>
      <pre id="boot-error-detail">Đang chờ ứng dụng khởi động…</pre>
      <p>Hãy tải lại trang. Nếu lỗi vẫn còn, gửi ảnh chụp màn hình thông báo này cho người quản lý website.</p>
      <button onclick="window.location.reload()">Tải lại trang</button>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
